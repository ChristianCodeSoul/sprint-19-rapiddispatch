services:
  mongodb:
    image: mongo:7
    container_name: shopin-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend1:
    build:
      context: ./backend
    container_name: shopin-backend-1
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/shopin
      JWT_SECRET: sprint15_shopin_secret
      PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb

  backend2:
    build:
      context: ./backend
    container_name: shopin-backend-2
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/shopin
      JWT_SECRET: sprint15_shopin_secret
      PORT: 4000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: shopin-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      - backend1
      - backend2

  nginx:
    image: nginx:alpine
    container_name: shopin-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend1
      - backend2

volumes:
  mongo_data:
